<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines 踩地雷</title>
  <style>
    :root {
      --bg: #0f212e;
      --card: #1a2c38;
      --green: #00e701;
      --red: #e9113c;
      --tile: #2f4553;
      --tile-off: #172733;
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); color: #fff; margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; user-select: none;
    }
    .app-header {
      background: var(--card); padding: 15px 20px; display: flex; 
      justify-content: space-between; align-items: center; border-bottom: 2px solid #233544;
      width: 100%; max-width: 600px;
    }
    .app-title { font-size: 18px; font-weight: bold; }
    .balance-box {
      background: #0f212e; padding: 6px 14px; border-radius: 20px;
      font-size: 16px; font-weight: bold; border: 1px solid #2f4553;
    }
    .balance-box span { color: var(--green); }
    .container { width: 100%; max-width: 600px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .status-banner { font-size: 16px; font-weight: bold; color: #b1bad2; text-align: center; min-height: 24px; }
    .grid-container { width: 100%; max-width: 420px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; aspect-ratio: 1; }
    .tile { 
      width: 100%; height: 100%; background: var(--tile); border: none; 
      border-radius: 8px; font-size: 24px; cursor: pointer; display: flex; 
      justify-content: center; align-items: center;
    }
    .tile:active:not(:disabled) { transform: scale(0.95); }
    .tile:disabled { cursor: default; background: var(--tile-off); }
    .tile.gem { background: #155224; border: 2px solid var(--green); }
    .tile.mine { background: #5c1421; border: 2px solid var(--red); }
    .controls-card { background: var(--card); padding: 15px; border-radius: 12px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .promo-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .promo-row input { 
      flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #2f4553; 
      background: #0f212e; color: #fff; font-size: 14px; font-weight: bold; 
      outline: none; text-transform: uppercase;
    }
    .promo-row input::placeholder { color: #5c6c7c; }
    .promo-row button { padding: 0 16px; border-radius: 8px; border: none; background: #3b5366; color: #fff; font-weight: bold; cursor: pointer; }
    .inputs-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .input-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .input-group label { font-size: 12px; color: #b1bad2; font-weight: bold; }
    .input-group input { 
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2f4553; 
      background: #0f212e; color: #fff; font-size: 16px; font-weight: bold; outline: none; text-align: center;
    }
    .action-btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    #startBtn { background: var(--green); color: #011000; }
    #cashoutBtn { background: #2f4553; color: #7f93a4; display: none; }
    #cashoutBtn.active { background: var(--green); color: #011000; display: block; }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="app-title">Mines 踩地雷</div>
    <div class="balance-box">$<span id="balance">0</span></div>
  </div>

  <div class="container">
    <div class="status-banner" id="statusMsg">請輸入序號兌換籌碼</div>

    <div class="grid-container">
      <div class="grid" id="grid"></div>
    </div>

    <div class="controls-card">
      <div class="promo-row">
        <input type="text" id="promoCode" placeholder="輸入兌換序號" autocomplete="off">
        <button onclick="redeemCode()">兌換</button>
      </div>

      <div class="inputs-row">
        <div class="input-group">
          <label>下注金額(沒錢就不要玩)</label>
          <input type="number" id="betAmount" value="10" min="1">
        </div>
        <div class="input-group">
          <label>地雷數量炸爛你</label>
          <input type="number" id="mineCount" value="3" min="1" max="24">
        </div>
      </div>

      <button id="startBtn" class="action-btn" onclick="startGame()">開始遊戲(敢不敢全丟!)</button>
      <button id="cashoutBtn" class="action-btn" onclick="cashout()">提現 ($<span id="cashoutAmount">0</span>)</button>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);

  let bal = parseInt(localStorage.getItem('m_bal')) || 0; 
  let used = JSON.parse(localStorage.getItem('m_used')) || [];

  // 序號雜湊表
  const codes = {
    'VIP888': 888, 'VIP999': 1000, 'VIP111': 500, 'VIP000': 10000, 'VIP': 100
  };

  function redeemCode() {
    const code = $('promoCode').value.trim().toUpperCase();
    if (!code) return alert('輸入序號啦?');
    if (used.includes(code)) return alert('❌ 此序號已經兌換過了傻逼！！');

    if (codes[code]) {
      const amt = codes[code];
      bal += amt;
      used.push(code);
      localStorage.setItem('m_used', JSON.stringify(used));
      syncBal();
      $('promoCode').value = '';
      alert(`✅ 兌換成功！獲得 $${amt} 代幣`);
    } else {
      alert('❌ 無效的序號！');
    }
  }

  let playing = false, mines = 3, bet = 10, mult = 1.0, board = [], opened = 0;

  function syncBal() {
    $('balance').innerText = bal;
    localStorage.setItem('m_bal', bal);
  }

  function drawBoard() {
    const el = $('grid');
    el.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const btn = document.createElement('button');
      btn.className = 'tile';
      btn.dataset.idx = i;
      btn.onclick = () => clickTile(i);
      el.appendChild(btn);
    }
  }

  function startGame() {
    bet = parseInt($('betAmount').value);
    mines = parseInt($('mineCount').value);

    if (isNaN(bet) || bet < 1) return alert('哈哈!你沒錢嘞輸入有效的金額');
    if (bet > bal) return alert('窮逼代幣不足，請輸入序號兌換！');
    if (mines < 1 || mines > 24) return alert('傻啊?地雷數量設定在 1 到 24 之間');

    bal -= bet;
    syncBal();

    board = Array(25 - mines).fill(0).concat(Array(mines).fill(1)).sort(() => Math.random() - 0.5);
    playing = true;
    opened = 0;
    mult = 1.0;

    $('startBtn').style.display = 'none';
    const cBtn = $('cashoutBtn');
    cBtn.style.display = 'block';
    cBtn.classList.remove('active');
    cBtn.disabled = true;
    
    $('cashoutAmount').innerText = '0';$('statusMsg').innerText = '點擊方塊尋找寶石！';
    drawBoard();
  }

  function clickTile(i) {
    if (!playing) return;
    const tiles = document.querySelectorAll('.tile');
    const t = tiles[i];
    if (t.disabled) return;

    t.disabled = true;

    if (board[i] === 1) {
      t.classList.add('mine');
      t.innerText = '💣';
      over(false);
    } else {
      t.classList.add('gem');
      t.innerText = '💎';
      opened++;

      mult = getMult(opened, mines);
      const payout = Math.floor(bet * mult);

      $('cashoutAmount').innerText = payout;
      const cBtn = $('cashoutBtn');
      cBtn.disabled = false;
      cBtn.classList.add('active');
      $('statusMsg').innerText = `目前倍數: ${mult.toFixed(2)}x`;

      if (opened === 25 - mines) cashout();
    }
  }

  function getMult(gems, mCount) {
    let res = 0.99;
    for (let i = 0; i < gems; i++) res *= (25 - i) / (25 - mCount - i);
    return res;
  }

  function cashout() {
    if (!playing) return;
    const win = Math.floor(bet * mult);
    bal += win;
    syncBal();
    $('statusMsg').innerText = `🎉 成功提現!你不敢全押 $${win}！`;
    over(true);
  }

  function over(win) {
    playing = false;
    $('startBtn').style.display = 'block';$('cashoutBtn').style.display = 'none';

    const tiles = document.querySelectorAll('.tile');
    board.forEach((val, idx) => {
      tiles[idx].disabled = true;
      if (val === 1) {
        if (!tiles[idx].classList.contains('mine')) {
          tiles[idx].classList.add('mine');
          tiles[idx].innerText = '💣';
        }
      } else {
        if (!tiles[idx].classList.contains('gem')) tiles[idx].innerText = '💎';
      }
    });

    if (!win) $('statusMsg').innerText = '💥 踩到地雷，遊戲結束！';
  }

  syncBal();
  drawBoard();
</script>
</body>
</html>
