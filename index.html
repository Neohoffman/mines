<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Mines 不要踩地雷</title>
  <style>
    /* 全局賽博朋克深黑背景 */
    body {
      background-color: #0b0711;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 主卡片：紫黑漸層與霓虹紫邊框 */
    .main-card {
      background: linear-gradient(145deg, #160e24, #1f1433);
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(138, 43, 226, 0.2);
      border: 1px solid #3d2563;
      box-sizing: border-box;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid #3d2563;
    }

    /* 標題與金額發光效果 */
    .game-title {
      margin: 0;
      font-size: 20px;
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }

    .money-display {
      color: #00ffcc;
      font-weight: bold;
      font-size: 20px;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    /* 格子按鈕重構 */
    .grid-btn {
      aspect-ratio: 1;
      background: #2a1b45;
      border: 1px solid #482f75;
      border-radius: 12px;
      font-size: 24px;
      cursor: pointer;
      color: #fff;
      transition: all 0.15s ease;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
    }

    .grid-btn:hover:not(:disabled) {
      background: #38245c;
      border-color: #00f2fe;
      transform: scale(1.03);
    }

    .grid-btn:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    .grid-btn.is-gem {
      background-color: #0d382c;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    .grid-btn.is-bomb {
      background-color: #3d0d1e;
      border: 2px solid #ff0055;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
    }

    /* 控制區域外觀 */
    .control-box {
      background: #11091c;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #2a1b45;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-group {
      flex: 1;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #a08dc0;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3d2563;
      background: #180e2b;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }

    .input-group input:focus {
      border-color: #00f2fe;
    }

    .btn-action {
      background: linear-gradient(135deg, #482f75, #351f57);
      color: #fff;
      border: 1px solid #624396;
      border-radius: 8px;
      margin-top: 22px;
      padding: 0 15px;
      height: 38px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #624396;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-start {
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .btn-start:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-cashout {
      background: linear-gradient(45deg, #ff9900, #ff5500);
      color: #fff;
      display: none;
      box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
    }

    .btn-cashout:hover {
      opacity: 0.9;
    }

    #info-text {
      text-align: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: #a08dc0;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="top-header">
      <h3 class="game-title">CYBER MINES</h3>
      <div>金幣: $<span id="user-balance" class="money-display">0</span></div>
    </div>

    <div id="info-text">請輸入兌換序號或設定金額開始遊戲</div>

    <div class="mines-grid" id="board"></div>

    <div class="control-box">
      <div class="input-row">
        <div class="input-group">
          <label>兌換序號</label>
          <input type="text" id="promo-code" placeholder="例如 VIP888">
        </div>
        <button class="btn-action" onclick="handleRedeem()">兌換</button>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label>入場金幣</label>
          <input type="number" id="bet-input" value="10">
        </div>
        <div class="input-group">
          <label>地雷數量 (1-24)</label>
          <input type="number" id="mines-input" value="3">
        </div>
      </div>

      <button id="start-btn" class="btn-main btn-start" onclick="onStartGame()">開始探索</button>
      <button id="cash-btn" class="btn-main btn-cashout" onclick="onCashout()">結算領取 ($<span id="win-amount">0</span>)</button>
    </div>
  </div>

<script>
  var balance = parseInt(localStorage.getItem('user_bal')) || 500;
  var isPlaying = false;
  var currentBet = 10;
  var currentMines = 3;
  var mapArr = [];
  var openedCount = 0;
  var currentRatio = 1.0;
  
  // 兌換碼設定
  var promoList = { 'VIP888': 888, 'VIP999': 1000, 'TEST': 50, 'VIP000': 100000000 };
  var usedCodes = JSON.parse(localStorage.getItem('used_codes')) || [];

  updateUIBalance();
  initBoard();

  function updateUIBalance() {
    document.getElementById('user-balance').innerText = balance;
    localStorage.setItem('user_bal', balance);
  }

  function handleRedeem() {
    var code = document.getElementById('promo-code').value.trim().toUpperCase();

    if (!code) {
      alert('請輸入兌換序號！');
      return;
    }

    if (usedCodes.indexOf(code) !== -1) {
      alert('Bro這序號被用過了！');
      return;
    }

    if (promoList[code]) {
      var reward = promoList[code];
      balance += reward;
      usedCodes.push(code);
      localStorage.setItem('used_codes', JSON.stringify(usedCodes));
      updateUIBalance();
      document.getElementById('promo-code').value = '';
      alert('兌換成功！獲得 $' + reward + ' 金幣');
    } else {
      alert('無效的兌換序號');
    }
  }

  function initBoard() {
    var container = document.getElementById('board');
    container.innerHTML = '';
    for (var i = 0; i < 25; i++) {
      var btn = document.createElement('button');
      btn.className = 'grid-btn';
      btn.setAttribute('data-idx', i);
      btn.onclick = function() {
        var idx = parseInt(this.getAttribute('data-idx'));
        clickSquare(idx);
      };
      container.appendChild(btn);
    }
  }

  function onStartGame() {
    currentBet = parseInt(document.getElementById('bet-input').value);
    currentMines = parseInt(document.getElementById('mines-input').value);

    if (isNaN(currentBet) || currentBet <= 0) return alert('請輸入有效的金幣數量！');
    if (currentBet > balance) return alert('Bro!金幣不足！');
    if (currentMines < 1 || currentMines > 24) return alert('Bro?地雷數量必須介於 1 至 24 之間！');

    balance -= currentBet;
    updateUIBalance();

    mapArr = Array(25 - currentMines).fill(0).concat(Array(currentMines).fill(1));
    shuffle(mapArr);

    isPlaying = true;
    openedCount = 0;
    currentRatio = 1.0;

    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('cash-btn').style.display = 'block';
    document.getElementById('cash-btn').disabled = true;
    document.getElementById('win-amount').innerText = '0';
    document.getElementById('info-text').innerText = '翻開方塊，避開隱藏的地雷！';

    initBoard();
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[i], array[j]];
    }
  }

  function clickSquare(index) {
    if (!isPlaying) return;
    
    var btns = document.querySelectorAll('.grid-btn');
    var targetBtn = btns[index];

    if (targetBtn.disabled) return;
    targetBtn.disabled = true;

    if (mapArr[index] === 1) {
      // 踩地雷
      targetBtn.classList.add('is-bomb');
      targetBtn.innerText = '💣';
      endGame(false);
    } else {
      // 點到寶石
      targetBtn.classList.add('is-gem');
      targetBtn.innerText = '💎';
      openedCount++;

      // 計算賠率 
      currentRatio = 0.99;
      for (var k = 0; k < openedCount; k++) {
        currentRatio *= (25 - k) / (25 - currentMines - k);
      }

      var currentWin = Math.floor(currentBet * currentRatio);
      document.getElementById('win-amount').innerText = currentWin;
      document.getElementById('cash-btn').disabled = false;
      document.getElementById('info-text').innerText = '當前獎勵倍數: ' + currentRatio.toFixed(2) + 'x';

      if (openedCount === (25 - currentMines)) {
        onCashout();
      }
    }
  }

  function onCashout() {
    if (!isPlaying) return;
    var winMoney = Math.floor(currentBet * currentRatio);
    balance += winMoney;
    updateUIBalance();
    document.getElementById('info-text').innerText = '結算成功！獲得 $' + winMoney + ' 金幣';
    endGame(true);
  }

  function endGame(isWin) {
    isPlaying = false;
    document.getElementById('start-btn').style.display = 'block';
    document.getElementById('cash-btn').style.display = 'none';

    var btns = document.querySelectorAll('.grid-btn');
    for (var i = 0; i < 25; i++) {
      btns[i].disabled = true;
      if (mapArr[i] === 1) {
        btns[i].classList.add('is-bomb');
        btns[i].innerText = '💣';
      } else {
        if (!btns[i].classList.contains('is-gem')) {
          btns[i].innerText = '💎';
          btns[i].style.opacity = '0.5';
        }
      }
    }

    if (!isWin) {
      document.getElementById('info-text').innerText = '💥 觸發地雷!!!';
    }
  }
</script>
</body>
</html>
