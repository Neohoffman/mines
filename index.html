<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines 踩地雷遊戲</title>
  <style>
   
    body {
      background-color: #0f212e;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-card {
      background: #1a2c38;
      width: 100%;
      max-width: 500px;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2f4553;
    }

    .money-display {
      color: #00e701;
      font-weight: bold;
      font-size: 18px;
    }

    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .grid-btn {
      aspect-ratio: 1;
      background: #2f4553;
      border: none;
      border-radius: 6px;
      font-size: 24px;
      cursor: pointer;
      color: #fff;
    }

    .grid-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .grid-btn.is-gem {
      background-color: #155224;
      border: 2px solid #00e701;
    }

    .grid-btn.is-bomb {
      background-color: #5c1421;
      border: 2px solid #e9113c;
    }

    /* control options */
    .control-box {
      background: #0f212e;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .input-group {
      flex: 1;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #8c9b9e;
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #2f4553;
      background: #1a2c38;
      color: #fff;
      box-sizing: border-box;
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-start { background: #00e701; color: #000; }
    .btn-cashout { background: #f2a900; color: #000; display: none; }

    #info-text {
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: #b1bad2;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="top-header">
      <h3 style="margin:0;">Mines Game</h3>
      <div>籌碼: $<span id="user-balance" class="money-display">0</span></div>
    </div>

    <div id="info-text">輸入序號或直接下注</div>

    <div class="mines-grid" id="board"></div>

    <div class="control-box">
      <div class="input-row">
        <div class="input-group">
          <label>兌換序號</label>
          <input type="text" id="promo-code" placeholder="如 VIP888">
        </div>
        <button onclick="handleRedeem()" style="margin-top: 18px; padding: 0 15px; cursor:pointer;">兌換</button>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label>下注金額</label>
          <input type="number" id="bet-input" value="10">
        </div>
        <div class="input-group">
          <label>地雷個數 (1-24)</label>
          <input type="number" id="mines-input" value="3">
        </div>
      </div>

      <button id="start-btn" class="btn-main btn-start" onclick="onStartGame()">開始遊戲</button>
      <button id="cash-btn" class="btn-main btn-cashout" onclick="onCashout()">提現 ($<span id="win-amount">0</span>)</button>
    </div>
  </div>

<script>
  
  var balance = parseInt(localStorage.getItem('user_bal')) || 500;
  var isPlaying = false;
  var currentBet = 10;
  var currentMines = 3;
  var mapArr = [];
  var openedCount = 0;
  var currentRatio = 1.0;
  
  // 兌換碼設定
  var promoList = { 'VIP888': 888, 'VIP999': 1000, 'TEST': 50 };
  var usedCodes = JSON.parse(localStorage.getItem('used_codes')) || [];

  updateUIBalance();
  initBoard();

  function updateUIBalance() {
    document.getElementById('user-balance').innerText = balance;
    localStorage.setItem('user_bal', balance);
  }

  function handleRedeem() {
    var code = document.getElementById('promo-code').value.trim().toUpperCase();
    console.log("嘗試兌換:", code); 

    if (!code) {
      alert('請輸入序號！');
      return;
    }

    if (usedCodes.indexOf(code) !== -1) {
      alert('這個序號用過了');
      return;
    }

    if (promoList[code]) {
      var reward = promoList[code];
      balance += reward;
      usedCodes.push(code);
      localStorage.setItem('used_codes', JSON.stringify(usedCodes));
      updateUIBalance();
      document.getElementById('promo-code').value = '';
      alert('成功兌換 $' + reward);
    } else {
      alert('無效序號');
    }
  }

  function initBoard() {
    var container = document.getElementById('board');
    container.innerHTML = '';
    for (var i = 0; i < 25; i++) {
      var btn = document.createElement('button');
      btn.className = 'grid-btn';
      btn.setAttribute('data-idx', i);
      btn.onclick = function() {
        var idx = parseInt(this.getAttribute('data-idx'));
        clickSquare(idx);
      };
      container.appendChild(btn);
    }
  }

  function onStartGame() {
    currentBet = parseInt(document.getElementById('bet-input').value);
    currentMines = parseInt(document.getElementById('mines-input').value);

    if (isNaN(currentBet) || currentBet <= 0) return alert('請輸入正確金額');
    if (currentBet > balance) return alert('餘額不足');
    if (currentMines < 1 || currentMines > 24) return alert('地雷數量要在 1-24 之間');

    balance -= currentBet;
    updateUIBalance();

   
    mapArr = Array(25 - currentMines).fill(0).concat(Array(currentMines).fill(1));
    shuffle(mapArr);

    isPlaying = true;
    openedCount = 0;
    currentRatio = 1.0;

    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('cash-btn').style.display = 'block';
    document.getElementById('cash-btn').disabled = true;
    document.getElementById('win-amount').innerText = '0';
    document.getElementById('info-text').innerText = '翻開方塊避開地雷！';

    initBoard();
  }


  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function clickSquare(index) {
    if (!isPlaying) return;
    
    var btns = document.querySelectorAll('.grid-btn');
    var targetBtn = btns[index];

    if (targetBtn.disabled) return;
    targetBtn.disabled = true;

    if (mapArr[index] === 1) {
      // 踩地雷
      targetBtn.classList.add('is-bomb');
      targetBtn.innerText = '💣';
      endGame(false);
    } else {
      // 點到寶石
      targetBtn.classList.add('is-gem');
      targetBtn.innerText = '💎';
      openedCount++;

      // 計算賠率 
      currentRatio = 0.99;
      for (var k = 0; k < openedCount; k++) {
        currentRatio *= (25 - k) / (25 - currentMines - k);
      }

      var currentWin = Math.floor(currentBet * currentRatio);
      document.getElementById('win-amount').innerText = currentWin;
      document.getElementById('cash-btn').disabled = false;
      document.getElementById('info-text').innerText = '當前倍數: ' + currentRatio.toFixed(2) + 'x';

      if (openedCount === (25 - currentMines)) {
        onCashout();
      }
    }
  }

  function onCashout() {
    if (!isPlaying) return;
    var winMoney = Math.floor(currentBet * currentRatio);
    balance += winMoney;
    updateUIBalance();
    document.getElementById('info-text').innerText = '提現成功！贏得 $' + winMoney;
    endGame(true);
  }

  function endGame(isWin) {
    isPlaying = false;
    document.getElementById('start-btn').style.display = 'block';
    document.getElementById('cash-btn').style.display = 'none';

    var btns = document.querySelectorAll('.grid-btn');
    for (var i = 0; i < 25; i++) {
      btns[i].disabled = true;
      if (mapArr[i] === 1) {
        btns[i].classList.add('is-bomb');
        btns[i].innerText = '💣';
      } else {
        if (!btns[i].classList.contains('is-gem')) {
          btns[i].innerText = '💎';
          btns[i].style.opacity = '0.6';
        }
      }
    }

    if (!isWin) {
      document.getElementById('info-text').innerText = '💥 踩到地雷，遊戲結束';
    }
  }
</script>
</body>
</html>
