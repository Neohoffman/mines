<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Mines 不要踩地雷</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #0b0711;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-card {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      border: 1px solid #3d2563;
      border-radius: 16px;
      background: linear-gradient(145deg, #160e24, #1f1433);
      box-shadow: 0 8px 30px rgba(138, 43, 226, .2);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 15px;
      border-bottom: 1px solid #3d2563;
    }

    .game-title {
      margin: 0;
      font-size: 20px;
      font-weight: bold;
      color: #00f2fe;
      text-shadow: 0 0 8px rgba(0, 242, 254, .35);
    }

    .money-display {
      color: #00ffcc;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 255, 204, .5);
    }

    #info-text {
      margin-bottom: 12px;
      color: #a08dc0;
      font-size: 14px;
      text-align: center;
    }

    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .grid-btn {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid #482f75;
      border-radius: 12px;
      background: #2a1b45;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: .15s;
      box-shadow: inset 0 2px 4px rgba(255,255,255,.05);
    }

    .grid-btn:hover:not(:disabled) {
      background: #38245c;
      border-color: #00f2fe;
      transform: scale(1.03);
    }

    .grid-btn:disabled {
      cursor: not-allowed;
      opacity: .85;
    }

    .grid-btn.is-gem {
      background: #0d382c;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 12px rgba(0,255,204,.4);
    }

    .grid-btn.is-bomb {
      background: #3d0d1e;
      border: 2px solid #ff0055;
      box-shadow: 0 0 12px rgba(255,0,85,.4);
    }

    .control-box {
      padding: 15px;
      border: 1px solid #2a1b45;
      border-radius: 12px;
      background: #11091c;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-group {
      flex: 1;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #a08dc0;
      font-size: 12px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #3d2563;
      border-radius: 8px;
      outline: none;
      background: #180e2b;
      color: #fff;
    }

    .input-group input:focus {
      border-color: #00f2fe;
    }

    .btn-action {
      height: 38px;
      margin-top: 22px;
      padding: 0 15px;
      border: 1px solid #624396;
      border-radius: 8px;
      background: #482f75;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-action:hover {
      background: #624396;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .btn-start {
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      color: #000;
      box-shadow: 0 4px 15px rgba(0,242,254,.3);
    }

    .btn-start:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    .btn-cashout {
      display: none;
      background: linear-gradient(45deg, #ff9900, #ff5500);
      color: white;
      box-shadow: 0 4px 15px rgba(255,153,0,.3);
    }

    @media (max-width: 450px) {
      body {
        padding: 10px;
      }

      .main-card {
        padding: 15px;
      }

      .input-row {
        gap: 7px;
      }
    }
  </style>
</head>

<body>

  <div class="main-card">

    <div class="top-header">
      <h3 class="game-title">CYBER MINES</h3>

      <div>
        金幣:
        $<span id="user-balance" class="money-display">0</span>
      </div>
    </div>

    <div id="info-text">
      請輸入兌換序號或設定金額開始遊戲
    </div>

    <div class="mines-grid" id="board"></div>

    <div class="control-box">

      <div class="input-row">
        <div class="input-group">
          <label>兌換序號</label>
          <input
            type="text"
            id="promo-code"
            placeholder="例如 VIP888"
          >
        </div>

        <button class="btn-action" id="redeem-btn">
          兌換
        </button>
      </div>

      <div class="input-row">

        <div class="input-group">
          <label>入場金幣</label>
          <input
            type="number"
            id="bet-input"
            value="10"
            min="1"
          >
        </div>

        <div class="input-group">
          <label>地雷數量 (1-24)</label>
          <input
            type="number"
            id="mines-input"
            value="3"
            min="1"
            max="24"
          >
        </div>

      </div>

      <button id="start-btn" class="btn-main btn-start">
        開始探索
      </button>

      <button id="cash-btn" class="btn-main btn-cashout">
        結算領取 ($<span id="win-amount">0</span>)
      </button>

    </div>
  </div>

  <script>

    // 遊戲基本資料
    let balance = Number(localStorage.getItem("user_bal")) || 500;
    let playing = false;
    let betAmount = 10;
    let mineAmount = 3;

    let boardData = [];
    let opened = 0;
    let multiplier = 1;

    const rewards = {
      VIP888: 888,
      VIP999: 1000,
      TEST: 50,
      VIP000: 100000000
    };

    let usedCodes =
      JSON.parse(localStorage.getItem("used_codes")) || [];


    const balanceText = document.getElementById("user-balance");
    const board = document.getElementById("board");
    const infoText = document.getElementById("info-text");

    const startButton = document.getElementById("start-btn");
    const cashButton = document.getElementById("cash-btn");

    const betInput = document.getElementById("bet-input");
    const minesInput = document.getElementById("mines-input");

    const redeemButton = document.getElementById("redeem-btn");
    const promoInput = document.getElementById("promo-code");

    const winText = document.getElementById("win-amount");


    // 更新金幣
    function refreshBalance() {
      balanceText.textContent = balance;
      localStorage.setItem("user_bal", balance);
    }


    // 建立遊戲棋盤
    function createBoard() {

      board.innerHTML = "";

      for (let i = 0; i < 25; i++) {

        const button = document.createElement("button");

        button.className = "grid-btn";
        button.dataset.index = i;

        // 修正：綁定點擊事件
        button.addEventListener("click", function () {
          chooseSquare(i);
        });

        board.appendChild(button);
      }
    }


    // 兌換序號
    function redeemCode() {

      const code = promoInput.value.trim().toUpperCase();

      if (code.length === 0) {
        alert("請輸入兌換序號！");
        return;
      }

      if (usedCodes.includes(code)) {
        alert("此序號已被使用！");
        return;
      }

      if (!(code in rewards)) {
        alert("無效的兌換序號");
        return;
      }

      const amount = rewards[code];

      balance += amount;

      usedCodes.push(code);

      localStorage.setItem(
        "used_codes",
        JSON.stringify(usedCodes)
      );

      refreshBalance();

      promoInput.value = "";

      alert("兌換成功！獲得 $" + amount + " 金幣");
    }


    // Fisher-Yates 洗牌
    function shuffle(list) {

      for (let i = list.length - 1; i > 0; i--) {

        const randomIndex =
          Math.floor(Math.random() * (i + 1));

        const temp = list[i];

        list[i] = list[randomIndex];
        list[randomIndex] = temp;
      }

      return list;
    }


    // 開始遊戲
    function startGame() {

      betAmount = parseInt(betInput.value);
      mineAmount = parseInt(minesInput.value);

      if (isNaN(betAmount) || betAmount <= 0) {
        alert("Bro輸入有效金幣量！");
        return;
      }

      if (betAmount > balance) {
        alert("Bro金幣不足！");
        return;
      }

      if (
        isNaN(mineAmount) ||
        mineAmount < 1 ||
        mineAmount > 24
      ) {
        alert("地雷數量必須介於 1 至 24 之間！");
        return;
      }


      balance -= betAmount;
      refreshBalance();


      // 先產生寶石，再放入地雷
      boardData = [];

      for (let i = 0; i < 25 - mineAmount; i++) {
        boardData.push(0);
      }

      for (let i = 0; i < mineAmount; i++) {
        boardData.push(1);
      }

      shuffle(boardData);


      playing = true;
      opened = 0;
      multiplier = 1;


      startButton.style.display = "none";
      cashButton.style.display = "block";
      cashButton.disabled = true;

      winText.textContent = "0";

      infoText.textContent =
        "避開隱藏的地雷！";

      createBoard();
    }


    // 玩家選擇格子
    function chooseSquare(index) {

      if (!playing) {
        return;
      }

      const buttons =
        document.querySelectorAll(".grid-btn");

      const currentButton = buttons[index];

      if (currentButton.disabled) {
        return;
      }

      currentButton.disabled = true;


      // 地雷
      if (boardData[index] === 1) {

        currentButton.classList.add("is-bomb");
        currentButton.textContent = "💣";

        finishGame(false);

        return;
      }


      // 寶石
      currentButton.classList.add("is-gem");
      currentButton.textContent = "💎";

      opened++;


      // 計算目前倍率
      multiplier = 0.99;

      for (let i = 0; i < opened; i++) {

        multiplier *=
          (25 - i) /
          (25 - mineAmount - i);
      }


      const currentPrize =
        Math.floor(betAmount * multiplier);

      winText.textContent = currentPrize;

      cashButton.disabled = false;

      infoText.textContent =
        "當前獎勵倍數: " +
        multiplier.toFixed(2) +
        "x";


      // 所有安全格都被翻開
      if (opened >= 25 - mineAmount) {
        cashOut();
      }
    }


    // 玩家主動結算
    function cashOut() {

      if (!playing) {
        return;
      }

      const prize =
        Math.floor(betAmount * multiplier);

      balance += prize;

      refreshBalance();

      infoText.textContent =
        "結算成功！獲得 $" + prize + " 金幣";

      finishGame(true);
    }


    // 結束遊戲
    function finishGame(win) {

      playing = false;

      startButton.style.display = "block";
      cashButton.style.display = "none";


      const buttons =
        document.querySelectorAll(".grid-btn");


      for (let i = 0; i < 25; i++) {

        buttons[i].disabled = true;


        if (boardData[i] === 1) {

          buttons[i].classList.add("is-bomb");
          buttons[i].textContent = "💣";

        } else {

          if (!buttons[i].classList.contains("is-gem")) {

            buttons[i].textContent = "💎";
            buttons[i].style.opacity = "0.5";
          }
        }
      }


      if (!win) {

        infoText.textContent =
          "💥 觸發地雷！";
      }
    }


    // 初始設定
    redeemButton.addEventListener("click", redeemCode);
    startButton.addEventListener("click", startGame);
    cashButton.addEventListener("click", cashOut);

    refreshBalance();
    createBoard();

  </script>

</body>
</html>
