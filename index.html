<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines 踩地雷</title>
  <style>
    :root {
      --bg-color: #0f212e;
      --card-bg: #1a2c38;
      --accent-green: #00e701;
      --accent-red: #e9113c;
      --tile-bg: #2f4553;
      --tile-disabled: #172733;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; touch-action: manipulation; }
    
    body { 
      font-family: var(--font-family); 
      background: var(--bg-color); 
      color: #fff; 
      margin: 0; 
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* 頂部列：滿版固定 */
    .app-header {
      background: var(--card-bg);
      padding: 15px 20px;
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      border-bottom: 2px solid #233544;
      width: 100%;
      max-width: 600px;
    }
    .app-title { font-size: 18px; font-weight: bold; }
    .balance-box {
      background: #0f212e;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 16px; 
      font-weight: bold;
      border: 1px solid #2f4553;
    }
    .balance-box span { color: var(--accent-green); }

    /* 主要容器 */
    .container {
      width: 100%;
      max-width: 600px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* 狀態提示 */
    .status-banner {
      font-size: 16px; 
      font-weight: bold;
      color: #b1bad2; 
      text-align: center;
      min-height: 24px;
    }

    /* 遊戲 5x5 盤面：固定正方形 */
    .grid-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 8px; 
      width: 100%; 
      aspect-ratio: 1;
    }
    .tile { 
      width: 100%; 
      height: 100%;
      background: var(--tile-bg); 
      border: none; 
      border-radius: 8px; 
      font-size: 24px; 
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center;
    }
    .tile:active:not(:disabled) { transform: scale(0.95); }
    .tile:disabled { cursor: default; background: var(--tile-disabled); }
    .tile.gem { background: #155224; border: 2px solid var(--accent-green); }
    .tile.mine { background: #5c1421; border: 2px solid var(--accent-red); }

    /* 控制卡片 */
    .controls-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
	    /* 序號輸入 */
    .promo-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .promo-row input { 
      flex: 1; padding: 10px; border-radius: 8px; 
      border: 1px solid #2f4553; background: #0f212e; color: #fff; 
      font-size: 14px; font-weight: bold; outline: none;
      text-transform: uppercase;
    }
    .promo-row input::placeholder { color: #5c6c7c; }
    .promo-row button { 
      padding: 0 16px; border-radius: 8px; border: none; 
      background: #3b5366; color: #fff; font-weight: bold; cursor: pointer; 
    }

    /* 下注參數 */
    .inputs-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .input-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .input-group label { font-size: 12px; color: #b1bad2; font-weight: bold; }
    .input-group input { 
      width: 100%; padding: 10px; border-radius: 8px; 
      border: 1px solid #2f4553; background: #0f212e; color: #fff; 
      font-size: 16px; font-weight: bold; outline: none; text-align: center;
    }

    /* 按鈕 */
    .action-btn { 
      width: 100%; padding: 14px; border-radius: 8px; 
      border: none; font-size: 16px; font-weight: bold; cursor: pointer; 
    }
    #startBtn { background: var(--accent-green); color: #011000; }
    #cashoutBtn { background: #2f4553; color: #7f93a4; display: none; }
    #cashoutBtn.active { background: var(--accent-green); color: #011000; display: block; }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <div class="app-header">
    <div class="app-title">Mines 踩地雷</div>
    <div class="balance-box">$<span id="balance">0</span></div>
  </div>

  <div class="container">
    <!-- 提示標題 -->
    <div class="status-banner" id="statusMsg">請輸入序號兌換籌碼</div>

    <!-- 5x5 遊戲區域 -->
    <div class="grid-container">
      <div class="grid" id="grid"></div>
    </div>

    <!-- 設定與操作面板 -->
    <div class="controls-card">
      <div class="promo-row">
        <input type="text" id="promoCode" placeholder="輸入兌換序號" autocomplete="off">
        <button onclick="redeemCode()">兌換</button>
      </div>

      <div class="inputs-row">
        <div class="input-group">
          <label>下注金額(沒錢就不要玩)</label>
          <input type="number" id="betAmount" value="10" min="1">
        </div>
        <div class="input-group">
          <label>地雷數量</label>
          <input type="number" id="mineCount" value="3" min="1" max="24">
        </div>
      </div>

      <button id="startBtn" class="action-btn" onclick="startGame()">開始遊戲</button>
      <button id="cashoutBtn" class="action-btn" onclick="cashout()">提現 ($<span id="cashoutAmount">0</span>)</button>
    </div>
  </div>

<script>
  let balance = parseInt(localStorage.getItem('mines_balance_universal')) || 0; 
  let usedCodes = JSON.parse(localStorage.getItem('used_codes_universal')) || [];

  // 可使用的兌換序號清單
  const validCodes = {
    'VIP888': 888,
    'VIP999': 1000,    
    'VIP111': 500,     
    'VIP000': 10000,  
    'VIP': 100         
  };

  function redeemCode() {
    const inputCode = document.getElementById('promoCode').value.trim().toUpperCase();

    if (!inputCode) return alert('輸入序號啦?');

    if (usedCodes.includes(inputCode)) {
      return alert('❌ 此序號已經兌換過了傻逼！！');
    }

    if (validCodes.hasOwnProperty(inputCode)) {
      const amount = validCodes[inputCode];
      balance += amount;
      usedCodes.push(inputCode);
      localStorage.setItem('used_codes_universal', JSON.stringify(usedCodes));
      
      updateBalanceDisplay();
      document.getElementById('promoCode').value = '';
      alert(`✅ 兌換成功！獲得 $${amount} 代幣`);
    } else {
      alert('❌ 無效的序號！');
    }
  }

  let gameActive = false;
  let mineCount = 3;
  let betAmount = 10;
  let currentMultiplier = 1.0;
  let gridState = [];
  let revealedCount = 0;

  function updateBalanceDisplay() {
    document.getElementById('balance').innerText = balance;
    localStorage.setItem('mines_balance_universal', balance);
  }

  function initGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const btn = document.createElement('button');
      btn.className = 'tile';
      btn.dataset.index = i;
      btn.onclick = () => revealTile(i);
      gridEl.appendChild(btn);
    }
  }

  function startGame() {
    betAmount = parseInt(document.getElementById('betAmount').value);
    mineCount = parseInt(document.getElementById('mineCount').value);

    if (isNaN(betAmount) || betAmount < 1) return alert('請輸入有效的下注金額');
    if (betAmount > balance) return alert('代幣不足，請輸入序號兌換！');
    if (mineCount < 1 || mineCount > 24) return alert('地雷數量請設定在 1 到 24 之間');

    balance -= betAmount;
    updateBalanceDisplay();

    gridState = Array(25 - mineCount).fill(0).concat(Array(mineCount).fill(1));
    gridState.sort(() => Math.random() - 0.5);

    gameActive = true;
    revealedCount = 0;
    currentMultiplier = 1.0;

    document.getElementById('startBtn').style.display = 'none';
    const cashoutBtn = document.getElementById('cashoutBtn');
    cashoutBtn.style.display = 'block';
    cashoutBtn.classList.remove('active');
    cashoutBtn.disabled = true;
    
    document.getElementById('cashoutAmount').innerText = '0';
    document.getElementById('statusMsg').innerText = '點擊方塊尋找寶石！';
    initGrid();
  }

  function revealTile(index) {
    if (!gameActive) return;

    const tiles = document.querySelectorAll('.tile');
    const tile = tiles[index];
    if (tile.disabled) return;

    tile.disabled = true;

    if (gridState[index] === 1) {
      tile.classList.add('mine');
      tile.innerText = '💣';
      endGame(false);
    } else {
      tile.classList.add('gem');
      tile.innerText = '💎';
      revealedCount++;

      currentMultiplier = calculateMultiplier(revealedCount, mineCount);
      const currentPayout = Math.floor(betAmount * currentMultiplier);

      document.getElementById('cashoutAmount').innerText = currentPayout;
      const cashoutBtn = document.getElementById('cashoutBtn');
      cashoutBtn.disabled = false;
      cashoutBtn.classList.add('active');
      document.getElementById('statusMsg').innerText = `目前倍數: ${currentMultiplier.toFixed(2)}x`;

      if (revealedCount === 25 - mineCount) cashout();
    }
  }

  function calculateMultiplier(gemsFound, mines) {
    let mult = 0.99;
    for (let i = 0; i < gemsFound; i++) {
      mult *= (25 - i) / (25 - mines - i);
    }
    return mult;
  }

  function cashout() {
    if (!gameActive) return;
    const winAmount = Math.floor(betAmount * currentMultiplier);
    balance += winAmount;
    updateBalanceDisplay();
    document.getElementById('statusMsg').innerText = `🎉 成功提現 $${winAmount}！`;
    endGame(true);
  }

  function endGame(isWin) {
    gameActive = false;
    document.getElementById('startBtn').style.display = 'block';
    const cashoutBtn = document.getElementById('cashoutBtn');
    cashoutBtn.style.display = 'none';

    const tiles = document.querySelectorAll('.tile');
    gridState.forEach((val, idx) => {
      tiles[idx].disabled = true;
      if (val === 1) {
        if (!tiles[idx].classList.contains('mine')) {
          tiles[idx].classList.add('mine');
          tiles[idx].innerText = '💣';
        }
      } else {
        if (!tiles[idx].classList.contains('gem')) {
          tiles[idx].innerText = '💎';
        }
      }
    });

    if (!isWin) document.getElementById('statusMsg').innerText = '💥 踩到地雷，遊戲結束！';
  }

  updateBalanceDisplay();
  initGrid();
</script>

</body>
</html>
